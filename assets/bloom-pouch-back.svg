<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 780" width="500" height="780">
  <defs>
    <linearGradient id="backBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#141518" />
      <stop offset="50%" stop-color="#1C1E24" />
      <stop offset="100%" stop-color="#111215" />
    </linearGradient>
    <filter id="backShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <g filter="url(#backShadow)">
    <!-- Main Pouch Shape -->
    <path d="M 55,95 C 50,220 40,480 50,680 C 55,710 130,735 250,735 C 370,735 445,710 450,680 C 460,480 450,220 445,95 Z" 
          fill="url(#backBody)" stroke="#2D313A" stroke-width="1.5" />
    <path d="M 60,60 Q 250,55 440,60 L 445,95 Q 250,90 55,95 Z" fill="#0F1013" />

    <!-- SECTION 1: HOW TO USE -->
    <g transform="translate(65, 115)">
      <rect x="0" y="0" width="370" height="24" fill="#FFB800" rx="3" />
      <text x="8" y="17" font-family="'Outfit', sans-serif" font-weight="800" font-size="12" fill="#0B0C0E">HOW TO USE</text>
      <text x="362" y="17" text-anchor="end" font-family="'Noto Sans Arabic', sans-serif" font-weight="700" font-size="12" fill="#0B0C0E">طريقة الاستخدام</text>
      
      <!-- English & Arabic Directions -->
      <text x="5" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#E5E7EB" width="180">
        <tspan x="5" dy="0">Take 1 rounded teaspoon (approx 8.3 g)</tspan>
        <tspan x="5" dy="13">daily. Stir thoroughly into 200–250 ml</tspan>
        <tspan x="5" dy="13">warm/lukewarm milk. Consume before</tspan>
        <tspan x="5" dy="13">bedtime at night.</tspan>
      </text>

      <text x="365" y="42" text-anchor="end" font-family="'Noto Sans Arabic', sans-serif" font-size="9.5" fill="#E5E7EB">
        <tspan x="365" dy="0">تناول ملعقة صغيرة ممتلئة (حوالي 8.3 غرام)</tspan>
        <tspan x="365" dy="13">يومياً. اخلط جيداً مع 200-250 مل من الحليب.</tspan>
        <tspan x="365" dy="13">ينصح بتناولها قبل النوم ليلاً.</tspan>
        <tspan x="365" dy="13">لأفضل النتائج، يستخدم بانتظام.</tspan>
      </text>
    </g>

    <!-- SECTION 2: INGREDIENTS -->
    <g transform="translate(65, 230)">
      <rect x="0" y="0" width="370" height="24" fill="#FF7A1A" rx="3" />
      <text x="8" y="17" font-family="'Outfit', sans-serif" font-weight="800" font-size="12" fill="#0B0C0E">INGREDIENTS</text>
      <text x="362" y="17" text-anchor="end" font-family="'Noto Sans Arabic', sans-serif" font-weight="700" font-size="12" fill="#0B0C0E">المكونات</text>

      <text x="5" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#D1D5DB">
        <tspan x="5" dy="0">Oat Powder, Date Powder, Banana Powder, Almond</tspan>
        <tspan x="5" dy="13">Powder, Whole Milk Powder, Whey Protein Concentrate,</tspan>
        <tspan x="5" dy="13">Natural Cocoa Powder &amp; Natural Flavors.</tspan>
        <tspan x="5" dy="13" font-weight="700" fill="#FFB800">No artificial colors or preservatives added.</tspan>
      </text>
    </g>

    <!-- SECTION 3: NUTRITION FACTS TABLE -->
    <g transform="translate(65, 330)">
      <rect x="0" y="0" width="370" height="210" fill="#121317" stroke="#374151" stroke-width="1" rx="4" />
      <rect x="0" y="0" width="370" height="26" fill="#1F2430" rx="3" />
      <text x="185" y="18" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="800" font-size="13" fill="#FFFFFF">NUTRITION FACTS (حقائق غذائية)</text>
      
      <text x="10" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#9CA3AF">Serving Size: 1 Teaspoon (Approx. 8.3 g) | Servings Per Pack: 30</text>
      <line x1="0" y1="48" x2="370" y2="48" stroke="#374151" stroke-width="1.5" />

      <!-- Row Items -->
      <g transform="translate(10, 66)" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">
        <text x="0" y="0" font-weight="700" fill="#FFFFFF">Energy / السعرات</text>
        <text x="350" y="0" text-anchor="end" font-weight="800" fill="#FFB800">63 kcal</text>
        
        <text x="0" y="18" fill="#E5E7EB">Protein / بروتين</text>
        <text x="350" y="18" text-anchor="end" fill="#E5E7EB">1.0 g</text>

        <text x="0" y="36" fill="#E5E7EB">Total Carbohydrates / كربوهيدرات</text>
        <text x="350" y="36" text-anchor="end" fill="#E5E7EB">11.4 g</text>

        <text x="0" y="54" fill="#9CA3AF">  Dietary Fiber / ألياف</text>
        <text x="350" y="54" text-anchor="end" fill="#9CA3AF">1.2 g</text>

        <text x="0" y="72" fill="#E5E7EB">Total Fat / دهون صحية</text>
        <text x="350" y="72" text-anchor="end" fill="#E5E7EB">1.3 g</text>

        <text x="0" y="90" fill="#E5E7EB">Calcium / كالسيوم</text>
        <text x="350" y="90" text-anchor="end" fill="#E5E7EB">25 mg</text>

        <text x="0" y="108" fill="#E5E7EB">Iron / حديد</text>
        <text x="350" y="108" text-anchor="end" fill="#E5E7EB">0.8 mg</text>

        <text x="0" y="126" fill="#E5E7EB">Potassium / بوتاسيوم</text>
        <text x="350" y="126" text-anchor="end" fill="#E5E7EB">95 mg</text>
      </g>
    </g>

    <!-- SECTION 4: STORAGE & PRODUCT DETAILS -->
    <g transform="translate(65, 560)" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#9CA3AF">
      <text x="0" y="0" font-weight="700" fill="#FFB800">STORAGE INSTRUCTIONS:</text>
      <text x="0" y="14">Store in a cool, dry place away from direct sunlight.</text>
      <text x="0" y="26">Keep container tightly sealed. Use a dry clean spoon.</text>

      <!-- Batch Info & Barcode Box -->
      <g transform="translate(0, 40)">
        <rect x="0" y="0" width="220" height="60" fill="#0B0C0E" stroke="#252832" rx="4" />
        <text x="10" y="18" fill="#E5E7EB">NET WEIGHT: <tspan font-weight="700" fill="#FFFFFF">250 g</tspan></text>
        <text x="10" y="34" fill="#E5E7EB">BATCH: <tspan font-weight="700" fill="#FF7A1A">BLM-PK-2026-08</tspan></text>
        <text x="10" y="50" fill="#9CA3AF">MRP: Rs. 1,650 (Incl. of all taxes)</text>

        <!-- Simulated Barcode -->
        <g transform="translate(240, 0)">
          <rect x="0" y="0" width="130" height="60" fill="#FFFFFF" rx="4" />
          <!-- Barcode lines -->
          <g fill="#000000" transform="translate(10, 8)">
            <rect x="0" y="0" width="3" height="35" />
            <rect x="5" y="0" width="1" height="35" />
            <rect x="8" y="0" width="4" height="35" />
            <rect x="15" y="0" width="2" height="35" />
            <rect x="20" y="0" width="1" height="35" />
            <rect x="24" y="0" width="5" height="35" />
            <rect x="32" y="0" width="2" height="35" />
            <rect x="36" y="0" width="3" height="35" />
            <rect x="42" y="0" width="1" height="35" />
            <rect x="46" y="0" width="4" height="35" />
            <rect x="53" y="0" width="2" height="35" />
            <rect x="58" y="0" width="5" height="35" />
            <rect x="66" y="0" width="1" height="35" />
            <rect x="70" y="0" width="3" height="35" />
            <rect x="76" y="0" width="2" height="35" />
            <rect x="81" y="0" width="4" height="35" />
            <rect x="88" y="0" width="2" height="35" />
            <rect x="94" y="0" width="4" height="35" />
            <rect x="102" y="0" width="3" height="35" />
            <text x="55" y="44" text-anchor="middle" font-family="'Courier', monospace" font-size="8" fill="#000000">896400125026</text>
          </g>
        </g>
      </g>
    </g>

  </g>
</svg>