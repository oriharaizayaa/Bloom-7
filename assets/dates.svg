<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="dateGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#8D4925" />
      <stop offset="60%" stop-color="#54250E" />
      <stop offset="100%" stop-color="#2D1104" />
    </radialGradient>
    <radialGradient id="dateGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF7A1A" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FF7A1A" stop-opacity="0" />
    </radialGradient>
  </defs>
  <circle cx="50" cy="50" r="45" fill="url(#dateGlow)" />
  <!-- Two stylized dates -->
  <g transform="rotate(-20 50 50)">
    <ellipse cx="44" cy="50" rx="18" ry="28" fill="url(#dateGrad)" stroke="#FFB800" stroke-width="1.5" />
    <path d="M 38,25 Q 44,50 36,75" stroke="#A75A30" stroke-width="1.5" fill="none" opacity="0.6" />
    <ellipse cx="62" cy="54" rx="15" ry="24" fill="url(#dateGrad)" stroke="#FFA726" stroke-width="1.5" />
    <circle cx="44" cy="24" r="3" fill="#3E1A08" />
    <circle cx="62" cy="32" r="2.5" fill="#3E1A08" />
  </g>
</svg>