<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="milkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#ECEFF1" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#90CAF9" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#90CAF9" stop-opacity="0.3" />
    </linearGradient>
    <radialGradient id="milkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#80D8FF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#80D8FF" stop-opacity="0" />
    </radialGradient>
  </defs>
  <circle cx="50" cy="50" r="45" fill="url(#milkGlow)" />
  <!-- Glass bottle / splash -->
  <g transform="translate(22, 12)">
    <path d="M 20,10 L 36,10 L 36,20 L 46,32 L 46,70 C 46,75 42,78 36,78 L 20,78 C 14,78 10,75 10,70 L 10,32 L 20,20 Z" 
          fill="#EBF4FE" stroke="url(#glassGrad)" stroke-width="2.5" />
    <!-- Milk inside -->
    <path d="M 12,42 Q 28,40 44,42 L 44,68 C 44,72 40,75 35,75 L 21,75 C 16,75 12,72 12,68 Z" 
          fill="url(#milkGrad)" />
    <!-- Milk Splash Drops -->
    <circle cx="48" cy="22" r="3.5" fill="#FFFFFF" />
    <circle cx="54" cy="32" r="2" fill="#FFFFFF" />
    <circle cx="8" cy="30" r="2.5" fill="#FFFFFF" />
  </g>
</svg>